# .github/workflows/template-cleanup.yml
name: Template Cleanup

on:
  push:
    branches:
      - main
      - master

jobs:
  cleanup:
    # Only run if this is NOT the template repo itself
    if: github.repository != 'YOUR_USERNAME/YOUR_TEMPLATE_REPO_NAME'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Remove template files
        run: |
          # List files/folders to remove from new repos
          rm -f README.md
          rm -f TEMPLATE_README.md
          rm -rf .github/workflows/template-cleanup.yml
          # Add any other files you want removed
          # rm -f LICENSE
          # rm -rf docs/template-specific/

          # Optionally rename a file (e.g., README.template.md -> README.md)
          if [ -f "README.template.md" ]; then
            mv README.template.md README.md
          fi

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "chore: initialize from template"
          git push
